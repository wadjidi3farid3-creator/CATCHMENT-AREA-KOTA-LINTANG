<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>terpadu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0;font-family:Arial,sans-serif}#map{background:#dce4e8}
.leaflet-control-zoom{margin:10px!important}.leaflet-bottom.leaflet-left{left:10px;bottom:10px;max-width:min(94vw,380px);z-index:1000}
#customControls{max-width:100%;max-height:calc(100vh - 30px);display:flex;flex-direction:column;gap:6px}#tools{display:flex;flex-direction:column;gap:6px;max-width:100%}
.toolbtn{border:0;background:#fff;color:#202124;padding:10px 12px;border-radius:8px;box-shadow:0 1px 5px #0003;font-weight:600;text-align:left;cursor:pointer;max-width:100%}
#panel{background:#fff;border-radius:9px;box-shadow:0 1px 6px #0003;overflow:hidden;max-height:min(45vh,440px);display:flex;flex-direction:column;min-width:0}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f2f4f5;font-weight:700;gap:8px}
#tree{overflow:auto;padding:8px 10px;min-height:30px}.row{display:flex;align-items:center;gap:6px;min-height:29px}.row label{flex:1;overflow-wrap:anywhere;font-size:13px;line-height:1.35}.toggle,.deleteNode{width:22px;height:22px;flex:0 0 22px;border:0;background:transparent;cursor:pointer}.deleteNode{color:#b42318;font-weight:bold}.children{margin-left:15px;border-left:1px solid #ddd;padding-left:6px}.hidden{display:none}.basebox{padding:8px 10px;border-top:1px solid #eee;font-size:13px;flex:0 0 auto}.basebox label{display:block;margin:6px 0}
#status{position:fixed;z-index:2000;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);max-height:30vh;overflow:auto;padding:9px 12px;border-radius:8px;background:#fff;box-shadow:0 1px 8px #0003;font-size:13px;line-height:1.45;text-align:center;overflow-wrap:anywhere;white-space:normal}
#status.ok{color:#18733a}#status.err{color:#a32323;background:#fff4f4}#status:empty{display:none}.leaflet-popup-content{overflow-wrap:anywhere;max-width:min(280px,75vw)}.leaflet-popup-content table{border-collapse:collapse;max-width:100%}.leaflet-popup-content td{padding:3px 5px;border-bottom:1px solid #eee;vertical-align:top;overflow-wrap:anywhere}
@media(max-width:600px){#panel{max-height:38vh}#customControls{max-height:calc(100vh - 20px)}.toolbtn{padding:9px 11px;font-size:13px}#status{font-size:12px;max-height:25vh}}
</style>
</head>
<body>
<div id="map"></div><div id="status">Menyiapkan WebGIS WGS 84 / EPSG:4326…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
const CRS_NAME='WGS 84'; const CRS_CODE='EPSG:4326';
const map=L.map('map',{zoomControl:false}).setView([-2.5,118],5);
L.control.zoom({position:'topright'}).addTo(map);
const base={
 'Google Hybrid':L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:21,attribution:'© Google'}),
 'Google Satellite':L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:21,attribution:'© Google'})
}; base['Google Hybrid'].addTo(map);
let layerRecords=[], gpsMarker=null;
const loadedSources=new Set();
function status(message,type){const el=document.getElementById('status');el.textContent=message;el.className=type||'';if(type==='ok')window.setTimeout(()=>{if(el.textContent===message)el.textContent=''},7000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function popupProps(feature){const p=feature.properties||{},keys=Object.keys(p).filter(k=>p[k]!==null&&p[k]!==undefined&&String(p[k]).trim()!=='');if(!keys.length)return 'Tidak ada atribut tambahan.';return '<table>'+keys.map(k=>'<tr><td><b>'+esc(k)+'</b></td><td>'+esc(typeof p[k]==='object'?JSON.stringify(p[k]):p[k])+'</td></tr>').join('')+'</table>'}
function styleFeature(f){const p=f.properties||{},c=p.stroke||p.color||'#3388ff',fill=p.fill||c;return{color:c,weight:Number(p['stroke-width']||2),opacity:Number(p['stroke-opacity']||.9),fillColor:fill,fillOpacity:Number(p['fill-opacity']||.25)}}
function validLonLat(lon,lat){return Number.isFinite(lon)&&Number.isFinite(lat)&&lon>=-180&&lon<=180&&lat>=-90&&lat<=90}
function validateGeoJSON(geo,label){let count=0,bad=0;function walk(c){if(!c)return;if(typeof c[0]==='number'&&typeof c[1]==='number'){count++;if(!validLonLat(Number(c[0]),Number(c[1])))bad++;return}if(Array.isArray(c))c.forEach(walk)};(geo.features||[]).forEach(f=>walk(f.geometry?.coordinates));if(!count)throw Error(label+': tidak ditemukan koordinat geometri.');if(bad)throw Error(label+': ditemukan '+bad+' koordinat di luar rentang WGS 84.');return count}
function makeLayer(geo,name){validateGeoJSON(geo,name);const layer=L.geoJSON(geo,{coordsToLatLng:c=>L.latLng(c[1],c[0],c[2]||0),style:styleFeature,pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#2463a6',weight:1,fillOpacity:.85}),onEachFeature:(f,l)=>{const label=f.properties?.name||f.properties?.Name||name;l.bindPopup('<b>'+esc(label)+'</b><hr style="margin:5px 0">'+popupProps(f))}});if(layer.getLayers().length){layer.addTo(map);const rec={layer,name};layerRecords.push(rec);return rec}return null}
function localTag(node){return String(node?.localName||node?.nodeName||'').split(':').pop().toLowerCase()}
function directChildren(node,tag){return [...(node?.children||[])].filter(n=>localTag(n)===tag.toLowerCase())}
function firstName(node,fallback){return directChildren(node,'name')[0]?.textContent?.trim()||fallback}
function placemarksToLayer(pms,label){if(!pms.length)return null;const d=document.implementation.createDocument('http://www.opengis.net/kml/2.2','kml',null),doc=d.createElementNS(d.documentElement.namespaceURI,'Document');d.documentElement.appendChild(doc);pms.forEach(pm=>doc.appendChild(d.importNode(pm,true)));const gj=toGeoJSON.kml(d);if(!gj.features?.length)return null;return makeLayer(gj,label)}
function buildTree(label,record,children=[]){const node=document.createElement('div'),row=document.createElement('div');row.className='row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.setAttribute('aria-label','Tampilkan '+label);const text=document.createElement('label');text.textContent=label;row.append(cb,text);node.append(row);const childBox=document.createElement('div');childBox.className='children';children.forEach(ch=>childBox.append(ch));if(children.length){const toggle=document.createElement('button');toggle.className='toggle';toggle.type='button';toggle.textContent='▾';toggle.title='Buka/tutup folder';row.prepend(toggle);toggle.onclick=()=>{childBox.classList.toggle('hidden');toggle.textContent=childBox.classList.contains('hidden')?'▸':'▾'}}
const del=document.createElement('button');del.className='deleteNode';del.type='button';del.textContent='×';del.title='Hapus layer dari tampilan';row.append(del);del.onclick=()=>{removeNodeLayers(node);node.remove();updateCount()};
cb.onchange=()=>{if(record){cb.checked?map.addLayer(record.layer):map.removeLayer(record.layer)}children.forEach(ch=>{const c=ch.querySelector(':scope > .row > input');if(c){c.checked=cb.checked;c.indeterminate=false;c.dispatchEvent(new Event('change'))}});syncParents(node)};
node.append(childBox);node._cb=cb;node._record=record;node._children=children;return node}
function removeNodeLayers(node){if(node._record){map.removeLayer(node._record.layer);layerRecords=layerRecords.filter(r=>r!==node._record)}(node._children||[]).forEach(removeNodeLayers)}
function syncParents(root){let parent=root.parentElement?.closest('.children')?.parentElement;if(!parent)return;let p=parent._cb;if(!p)return;let children=(parent._children||[]).map(n=>n._cb).filter(Boolean);if(children.length){let checked=children.filter(c=>c.checked&&!c.indeterminate).length,partial=children.some(c=>c.indeterminate);p.checked=checked===children.length;p.indeterminate=partial||(checked>0&&checked<children.length);syncParents(parent)}}
function updateCount(){document.getElementById('panelCount').textContent=document.querySelectorAll('#tree > div').length+' sumber'}
function parseFolder(folder){const name=firstName(folder,'Folder tanpa nama'),pms=directChildren(folder,'placemark'),subs=directChildren(folder,'folder').map(parseFolder),rec=placemarksToLayer(pms,name);return buildTree(name,rec,subs)}
function parseContainer(container){const nodes=[],direct=directChildren(container,'placemark');if(direct.length){const rec=placemarksToLayer(direct,'Data utama');if(rec)nodes.push(buildTree('Data utama',rec))}directChildren(container,'folder').forEach(f=>nodes.push(parseFolder(f)));directChildren(container,'document').forEach(d=>nodes.push(...parseContainer(d)));return nodes}
function parseKML(xml,sourceName){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw Error('Dokumen XML KML tidak valid atau rusak.');if(localTag(doc.documentElement)!=='kml')throw Error('Konten bukan dokumen KML yang valid.');const documentNodes=directChildren(doc.documentElement,'document');let nodes=[];if(documentNodes.length)documentNodes.forEach(d=>nodes.push(...parseContainer(d)));else nodes=parseContainer(doc.documentElement);if(!nodes.length){const geo=toGeoJSON.kml(doc);if(!geo.features?.length)throw Error('KML tidak memiliki Placemark/geometri yang dapat ditampilkan.');const rec=makeLayer(geo,'Data KML');if(rec)nodes.push(buildTree('Data KML',rec))}if(!nodes.length)throw Error('KML terbaca, tetapi tidak ditemukan Placemark dengan geometri.');const root=buildTree(sourceName,null,nodes);document.getElementById('tree').append(root);updateCount();return nodes.length}
function recomputeBounds(){let bounds=L.latLngBounds();layerRecords.forEach(r=>{if(map.hasLayer(r.layer)){const b=r.layer.getBounds?.();if(b?.isValid())bounds.extend(b)}});return bounds}
function zoomAll(){const b=recomputeBounds();if(b.isValid())map.fitBounds(b.pad(.04));else status('Tidak ada geometri layer yang sedang ditampilkan.','err')}
function locate(){if(!navigator.geolocation){status('Browser ini tidak menyediakan layanan lokasi/GPS.','err');return}status('Meminta lokasi GPS perangkat…');navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude],acc=Math.round(pos.coords.accuracy||0);if(gpsMarker)map.removeLayer(gpsMarker);gpsMarker=L.circleMarker(ll,{radius:8,color:'#1677ff',fillColor:'#1677ff',fillOpacity:.9}).addTo(map).bindPopup('Lokasi perangkat<br>WGS 84 / EPSG:4326<br>Akurasi ±'+acc+' m').openPopup();map.setView(ll,17);status('Lokasi diperoleh | WGS 84 / EPSG:4326 | Akurasi ±'+acc+' m','ok')},err=>{const msg={1:'Izin lokasi ditolak.',2:'Posisi tidak tersedia.',3:'Permintaan GPS melewati batas waktu.'}[err.code]||err.message;status('GPS gagal: '+msg+' Pastikan izin lokasi aktif dan halaman dibuka melalui HTTPS.','err')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function togglePanel(){const p=document.getElementById('panel');p.style.display=p.style.display==='none'?'flex':'none'}
function normalizeSource(url){try{return new URL(url,location.href).href.split('#')[0]}catch(e){return url}}
async function loadRemote(url){url=url.trim();if(!url)throw Error('URL file belum diisi.');const resolved=normalizeSource(url);if(loadedSources.has(resolved)){status('Sumber ini sudah dimuat: '+resolved,'ok');return 0}if(!/^https?:\/\//i.test(resolved))throw Error('Sumber harus diakses melalui HTTP(S).');status('Mengambil '+resolved+'…');const response=await fetch(resolved);if(!response.ok)throw Error('HTTP '+response.status+' saat mengambil file. Periksa URL, nama file, dan izin repository.');const blob=await response.blob(),name=decodeURIComponent(resolved.split('/').pop().split('?')[0]||'Layer');let xml;
if(name.toLowerCase().endsWith('.kmz')||blob.type==='application/vnd.google-earth.kmz'){if(typeof JSZip==='undefined')throw Error('Pustaka pembaca KMZ gagal dimuat.');const zip=await JSZip.loadAsync(await blob.arrayBuffer()),files=Object.keys(zip.files).filter(k=>!zip.files[k].dir&&k.toLowerCase().endsWith('.kml'));if(!files.length)throw Error('KMZ tidak berisi file KML.');const chosen=files.find(k=>k.toLowerCase()==='doc.kml')||files[0];xml=await zip.files[chosen].async('text')}else{xml=await blob.text();if(!/<(?:[\w.-]+:)?kml[\s>]/i.test(xml))throw Error('URL tidak mengembalikan dokumen KML. Gunakan URL raw GitHub atau GitHub Pages, bukan halaman github.com/blob.')}
const before=layerRecords.length;parseKML(xml,name);const added=layerRecords.length-before;loadedSources.add(resolved);status('Berhasil memuat '+name+' | layer geometri: '+added+' | CRS WGS 84 / EPSG:4326','ok');const b=recomputeBounds();if(b.isValid())map.fitBounds(b.pad(.04));return added}
function addRemoteLayer(){const url=window.prompt('Masukkan URL KML/KMZ tambahan.\nGunakan URL raw.githubusercontent.com atau URL GitHub Pages.\n\nContoh: https://raw.githubusercontent.com/akun/repo/main/DATA/layer.kml');if(url===null)return;loadRemote(url).catch(e=>status('GAGAL MEMUAT LAYER TAMBAHAN: '+(e.message||e)+' | Periksa URL dan izin CORS sumber.','err'))}
function buildControls(){const ctl=L.control({position:'bottomleft'});ctl.onAdd=()=>{const div=L.DomUtil.create('div');div.id='customControls';div.innerHTML='<div id="tools"><button class="toolbtn" type="button" id="zoomBtn">⌖ Zoom Seluruh Data</button><button class="toolbtn" type="button" id="gpsBtn">◎ Lokasi Saya</button><button class="toolbtn" type="button" id="addBtn">＋ Tambah Layer KML/KMZ</button><button class="toolbtn" type="button" id="panelBtn">▤ Panel Layer</button></div><div id="panel"><div id="panelHead"><span>Layer KML/KMZ</span><span id="panelCount">0 sumber</span></div><div id="tree"></div><div class="basebox"><b>Basemap</b><label><input type="radio" name="base" value="Google Hybrid" checked> Google Hybrid</label><label><input type="radio" name="base" value="Google Satellite"> Google Satellite</label><div style="font-size:11px;color:#666;margin-top:7px">CRS data: WGS 84 / EPSG:4326</div></div></div>';L.DomEvent.disableClickPropagation(div);L.DomEvent.disableScrollPropagation(div);div.querySelector('#zoomBtn').onclick=zoomAll;div.querySelector('#gpsBtn').onclick=locate;div.querySelector('#addBtn').onclick=addRemoteLayer;div.querySelector('#panelBtn').onclick=togglePanel;return div};ctl.addTo(map);document.addEventListener('change',e=>{if(e.target?.name==='base'){Object.values(base).forEach(l=>map.removeLayer(l));base[e.target.value]?.addTo(map)}})}
buildControls();
// PEMUATAN OTOMATIS: berjalan saat halaman dibuka, tanpa menekan tombol Tambah Layer.
const INITIAL_KML_URL='DATA/sumber.kml';
(async()=>{try{status('Memuat otomatis '+INITIAL_KML_URL+' | WGS 84 / EPSG:4326…');await loadRemote(INITIAL_KML_URL)}catch(e){status('GAGAL MEMUAT KML AWAL: '+(e.message||e)+' | Pastikan DATA/sumber.kml berada sejajar dengan index.html di repository dan halaman dibuka melalui HTTP(S).','err')}})();
</script></body></html>
